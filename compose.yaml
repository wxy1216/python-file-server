services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-file_server}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-file_server}
      POSTGRES_DB: ${POSTGRES_DB:-file_server}
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  migrate:
    image: python-file-server:latest
    environment:
      DATABASE_URL: postgresql+asyncpg://file_server:file_server@postgres:5432/file_server
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  app1:
    build:
      context: .
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.13-slim}
    image: python-file-server:latest
    expose:
      - "8000"
    environment:
      API_TOKEN: ${API_TOKEN:-}
      DATABASE_URL: postgresql+asyncpg://file_server:file_server@postgres:5432/file_server
      FILE_STORAGE_DIR: /app/data/files
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-104857600}
    volumes:
      - file-data:/app/data/files
      - logs-app1:/app/logs
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  app2:
    image: python-file-server:latest
    expose:
      - "8000"
    environment:
      API_TOKEN: ${API_TOKEN:-}
      DATABASE_URL: postgresql+asyncpg://file_server:file_server@postgres:5432/file_server
      FILE_STORAGE_DIR: /app/data/files
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-104857600}
    volumes:
      - file-data:/app/data/files
      - logs-app2:/app/logs
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

volumes:
  file-data:
  logs-app1:
  logs-app2:
  postgres-data:
